"Attack vector(s)": "Compile crafted MLIR input containing func.call operations inside loop constructs."
"Suggested description of the vulnerability for use in the CVE": |
  SCFToCalyx does not support func.call operations inside loop bodies, causing the lower-scf-to-calyx pass in the CIRCT Calyx backend to crash (segmentation fault) when processing such SCF loops, resulting in denial of service during compilation.
